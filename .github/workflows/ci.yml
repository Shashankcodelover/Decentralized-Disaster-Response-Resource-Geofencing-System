name: Mirage CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Lint & Type Check ---
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: TypeScript Check (API)
        run: cd apps/server && npx tsc --noEmit
      - name: TypeScript Check (Web)
        run: cd apps/web && npx tsc --noEmit

  # --- Unit Tests ---
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Run API Tests
        run: cd apps/server && pnpm test
        env:
          MONGO_URI: mongodb://localhost:27017/mirage-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  # --- Docker Build (validates Dockerfiles) ---
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API Image
        run: docker build -f apps/server/Dockerfile -t mirage-api:ci .
      - name: Build Web Image
        run: docker build -f apps/web/Dockerfile -t mirage-web:ci .
